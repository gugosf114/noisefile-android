<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NoiseFile helps Bay Area residents understand local noise rules, document incidents, and reach the correct official complaint route.">
  <title>NoiseFile — Know the rule. Log the noise. File the complaint.</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10192b;
      color: #fff7e8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      place-content: center;
      padding: 64px 0;
    }
    img { width: 112px; height: 112px; border-radius: 24px; }
    h1 { margin: 24px 0 8px; font-size: clamp(2.6rem, 10vw, 5rem); line-height: .95; }
    .tagline { margin: 0; color: #ffb13b; font-weight: 750; letter-spacing: .02em; }
    .summary { max-width: 640px; margin: 28px 0; color: #d6dbea; font-size: 1.1rem; line-height: 1.65; }
    a { color: #ffcf83; }
  </style>
</head>
<body>
  <main>
    <img src="design/noisefile-icon-play-512.png" alt="NoiseFile app icon">
    <h1>NoiseFile</h1>
    <p class="tagline">Know the rule. Log the noise. File the complaint.</p>
    <p class="summary">
      NoiseFile explains local noise requirements, measures and logs an incident,
      and prepares the correct official next step. It covers animal, general-noise,
      and construction workflows across 15 Bay Area cities.
    </p>
    <p><a href="privacy.html">Privacy policy</a></p>
  </main>
</body>
</html>
